[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectune"
version = "0.1.0"
description = "Composable tools for spectrum reasoning agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
chem = ["rdkit"]
mcp = ["fastmcp"]
reaction = ["pandas"]
data = ["pandas", "pyarrow"]
classifier = ["numpy", "scikit-learn", "matplotlib", "pillow", "rdkit", "torch", "transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
