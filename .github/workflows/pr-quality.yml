name: PR Quality

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate with the trusted checker from the target branch so a PR
          # cannot weaken its own metadata requirements.
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Check title, description, and checklist
        run: python .github/scripts/check_pr.py
